<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO BrickFinder | 樂高型號查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* === 品牌核心與基礎樣式 === */
        .lego-red { background-color: #d11013; } /* 樂高經典紅 */
        .card-shadow { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-loading { opacity: 0.7; pointer-events: none; } /* 阻擋載入中的重複點擊 */
        
        /* === 微動效：愛心跳動動畫 (收藏點擊回饋) === */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .heart-active { 
            animation: heartBeat 0.8s ease-in-out; 
            display: inline-block;
        }

        /* === 微動效：收藏卡片滑入與懸停放大 === */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .collection-card {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .collection-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* === 微動效：歷史標籤懸停變色 === */
        .history-tag {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .history-tag:hover {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="lego-red p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tighter">LEGO <span class="font-light">BrickFinder</span></h1>
        </div>
    </nav>

    <div class="container mx-auto mt-10 px-4">
        <div class="max-w-xl mx-auto text-center">
            <h2 class="text-3xl font-bold mb-4 text-gray-800">搜尋你的型號</h2>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="輸入樂高型號 (如: 10333)..." 
                       class="flex-1 p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none" autofocus>
                <button id="searchBtn" onclick="searchLego()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">查詢</button>
            </div>
            
            <div id="historySection" class="mt-4 hidden">
                <div class="flex justify-center items-center gap-2 mb-2">
                    <span class="text-gray-400 text-sm">最近搜尋</span>
                    <button onclick="clearHistory()" class="text-xs text-blue-500 hover:underline">清除全部</button>
                </div>
                <div id="historyContainer" class="flex flex-wrap justify-center gap-2"></div>
            </div>
            
            <p id="statusMsg" class="mt-3 text-red-500 hidden italic"></p>
        </div>
    </div>

    <main class="container mx-auto mt-10 px-4">
        <div id="resultContainer" class="max-w-4xl mx-auto bg-white rounded-2xl p-6 card-shadow hidden">
            <div class="md:flex gap-8">
                <div class="md:w-1/2">
                    <img id="legoImg" src="" alt="Lego Image" class="w-full h-auto rounded-lg object-contain">
                </div>
                <div class="md:w-1/2 mt-6 md:mt-0">
                    <div class="flex justify-between items-start">
                        <h3 id="legoName" class="text-2xl font-bold text-gray-900 mb-2"></h3>
                        <button id="favoriteBtn" onclick="toggleFavorite()" class="text-3xl focus:outline-none transition active:scale-90">🤍</button>
                    </div>
                    <div class="space-y-3 text-gray-600">
                        <p><strong>型號：</strong> <span id="legoId"></span></p>
                        <p><strong>零件數量：</strong> <span id="legoPieces"></span> pcs</p>
                        <p><strong>發行年份：</strong> <span id="legoYear"></span></p>
                        <p><strong>主題系列：</strong> <span id="legoTheme" class="text-blue-600 font-medium">載入中...</span></p>
                        <hr>
                        <a id="legoUrl" href="#" target="_blank" rel="noopener noreferrer" 
                           class="flex justify-center items-center gap-2 w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-500 transition shadow-sm active:scale-95">
                            <span>查看詳細資訊</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section class="container mx-auto mt-16 px-4 pb-20">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-2 mb-6 border-b-2 border-gray-200 pb-2">
                <span class="text-2xl">🤖</span>
                <h2 class="text-2xl font-bold text-gray-800">我的收藏清單</h2>
            </div>
            <div id="collectionGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            <p id="emptyMsg" class="text-gray-400 text-center py-10 italic">尚未收藏任何樂高型號</p>
        </div>
    </section>

    <script>
        // === 全域變數與環境設定 ===
        const API_KEY = '8cbdfafeaae44206585e06909cf319fc'; // Rebrickable API 憑證
        let currentLegoData = null;                         // 暫存當前搜尋成功的樂高資料物件

        // 頁面初始化：讀取 LocalStorage 快取並渲染畫面
        window.onload = () => {
            displayHistory();
            displayCollection();
        };

        /**
         * 主功能：發送 API 查詢樂高型號
         * @param {string|null} targetId - 選填。若由歷史紀錄或收藏點擊觸發，則直接傳入型號
         */
        async function searchLego(targetId = null) {
            let id = targetId || document.getElementById('searchInput').value.trim();
            if (targetId) document.getElementById('searchInput').value = targetId; // 反填回輸入框
            
            const status = document.getElementById('statusMsg');
            const result = document.getElementById('resultContainer');
            const btn = document.getElementById('searchBtn');
            
            if (!id) return;
            // Rebrickable API 的盒組後綴規範 (例如：10333 必須轉換為 10333-1)
            const formattedId = id.includes('-') ? id : `${id}-1`;

            // UI 狀態重設：切換至讀取中狀態
            status.classList.add('hidden');
            btn.innerText = "搜尋中...";
            btn.classList.add('btn-loading');

            try {
                // 非同步發送請求，並帶上驗證 Header
                const response = await fetch(`https://rebrickable.com/api/v3/lego/sets/${formattedId}/`, {
                    headers: { 'Authorization': `key ${API_KEY}` }
                });
                if (!response.ok) throw new Error("找不到該型號。");

                currentLegoData = await response.json();
                saveToHistory(id);          // 儲存至搜尋紀錄
                displayResult(currentLegoData); // 渲染主畫面
            } catch (err) {
                // 錯誤處理：顯示錯誤訊息並隱藏結果圖層
                status.innerText = err.message;
                status.classList.remove('hidden');
                result.classList.add('hidden');
            } finally {
                // UI 狀態還原
                btn.innerText = "查詢";
                btn.classList.remove('btn-loading');
            }
        }

        /**
         * 渲染搜尋結果資料至 DOM
         * @param {Object} data - Rebrickable 回傳的盒組資料
         */
        function displayResult(data) {
            const resultContainer = document.getElementById('resultContainer');
            document.getElementById('legoName').innerText = data.name;
            document.getElementById('legoId').innerText = data.set_num.replace('-1', '');
            document.getElementById('legoPieces').innerText = data.num_parts;
            document.getElementById('legoYear').innerText = data.year;
            document.getElementById('legoImg').src = data.set_img_url || 'https://via.placeholder.com/600x400';
            document.getElementById('legoUrl').href = data.rebrickable_url;

            //同步更新愛心狀態
            updateHeartUI(data.set_num);

            // 淡入動畫效果觸發 (利用 setTimeout 確保瀏覽器有時間反應 class 變化)
            resultContainer.classList.remove('hidden');
            resultContainer.style.opacity = "0";
            setTimeout(() => {
                resultContainer.style.transition = "opacity 0.5s";
                resultContainer.style.opacity = "1";
            }, 10);

            // 由於主題名稱不在同支 API，需額外再查一次 Theme API
            fetchTheme(data.theme_id);
        }

        /**
         * 根據 Theme ID 查詢樂高系列名稱 (如：Icons, Star Wars)
         * @param {number} themeId 
         */
        async function fetchTheme(themeId) {
            const themeSpan = document.getElementById('legoTheme');
            try {
                const res = await fetch(`https://rebrickable.com/api/v3/lego/themes/${themeId}/`, {
                    headers: { 'Authorization': `key ${API_KEY}` }
                });
                const themeData = await res.json();
                themeSpan.innerText = themeData.name;
            } catch { themeSpan.innerText = "未知系列"; }
        }

        /**
         * 切換收藏狀態 (新增/移除) 並同步至 LocalStorage
         */
        function toggleFavorite() {
            if (!currentLegoData) return;
            let collection = JSON.parse(localStorage.getItem('legoCollection') || '[]');
            const index = collection.findIndex(item => item.set_num === currentLegoData.set_num);
            const btn = document.getElementById('favoriteBtn');

            if (index === -1) {
                // 狀態 A: 不存在於收藏清單內 -> 執行新增
                collection.push({
                    set_num: currentLegoData.set_num,
                    name: currentLegoData.name,
                    img: currentLegoData.set_img_url,
                    year: currentLegoData.year
                });
                // 觸發愛心跳動的 CSS 動效
                btn.classList.add('heart-active');
                setTimeout(() => btn.classList.remove('heart-active'), 800);
            } else {
                // 狀態 B: 已存在於收藏清單內 -> 執行移除
                collection.splice(index, 1);
            }

            // 更新 LocalStorage 緩存與重繪 UI
            localStorage.setItem('legoCollection', JSON.stringify(collection));
            updateHeartUI(currentLegoData.set_num);
            displayCollection();
        }

        /**
         * 更新當前主要結果卡片上的愛心圖示 (紅心/白心)
         * @param {string} setNum 
         */
        function updateHeartUI(setNum) {
            const collection = JSON.parse(localStorage.getItem('legoCollection') || '[]');
            const isFav = collection.some(item => item.set_num === setNum);
            document.getElementById('favoriteBtn').innerText = isFav ? "❤️" : "🤍";
        }

        /**
         * 讀取並渲染「我的收藏清單」區塊
         */
        function displayCollection() {
            const grid = document.getElementById('collectionGrid');
            const emptyMsg = document.getElementById('emptyMsg');
            const collection = JSON.parse(localStorage.getItem('legoCollection') || '[]');

            if (collection.length === 0) {
                grid.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                return;
            }

            // 隱藏空提示，動態生成收藏卡片，並為每個卡片加上交錯的動畫延遲(stagger effect)
            emptyMsg.classList.add('hidden');
            grid.innerHTML = collection.map((item, index) => `
                <div class="collection-card bg-white p-3 rounded-xl shadow-sm border border-gray-100 cursor-pointer" 
                     style="animation-delay: ${index * 0.1}s"
                     onclick="searchLego('${item.set_num}')">
                    <div class="overflow-hidden rounded mb-2">
                        <img src="${item.img || 'https://via.placeholder.com/150'}" class="w-full h-24 object-contain transition-transform duration-500 hover:scale-110">
                    </div>
                    <p class="text-xs font-bold text-gray-400">${item.set_num.replace('-1', '')}</p>
                    <p class="text-sm font-bold text-gray-800 truncate">${item.name}</p>
                </div>
            `).join('');
        }

        // === 搜尋紀錄與清除功能 ===

        /**
         * 儲存最近搜尋型號 (限制最多存 5 筆，且不重複)
         * @param {string} id 
         */
        function saveToHistory(id) {
            let history = JSON.parse(localStorage.getItem('legoHistory') || '[]');
            // 過濾掉重複的，將最新的推到最前面，並切出前5筆
            history = [id, ...history.filter(i => i !== id)].slice(0, 5);
            localStorage.setItem('legoHistory', JSON.stringify(history));
            displayHistory();
        }

        /**
         * 讀取並渲染「最近搜尋」標籤
         */
        function displayHistory() {
            const section = document.getElementById('historySection');
            const container = document.getElementById('historyContainer');
            const history = JSON.parse(localStorage.getItem('legoHistory') || '[]');
            
            if (history.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            container.innerHTML = '';
            // 動態建立 DOM 節點並綁定點擊事件
            history.forEach(id => {
                const tag = document.createElement('span');
                tag.className = "history-tag bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium border border-gray-300";
                tag.innerText = id;
                tag.onclick = () => searchLego(id);
                container.appendChild(tag);
            });
        }

        /**
         * 清除所有本地搜尋紀錄
         */
        function clearHistory() {
            if (confirm("確定要清除所有搜尋紀錄嗎？")) {
                localStorage.removeItem('legoHistory');
                displayHistory();
            }
        }

        // 綁定鍵盤事件：在輸入框按下 Enter 鍵直接觸發搜尋
        document.getElementById('searchInput').addEventListener('keypress', (e) => e.key === 'Enter' && searchLego());
    </script>
</body>
</html>
